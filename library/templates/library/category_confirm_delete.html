<h2>Eliminar categoría</h2>

<p>
    ¿Está seguro de que desea eliminar la categoría
    <strong>"{{ object.name }}"</strong>?
</p>

<form method="post">
    {% csrf_token %}
    <button class="btn btn-delete" type="submit">
        Sí, eliminar
    </button>
</form>

<a href="{% url 'book_list' %}">Cancelar</a>
